<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PL vs BARANG Checker</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#222}
.wrap{max-width:1050px;margin:35px auto;padding:0 18px}
.card{background:#fff;padding:24px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 15px #00000012}
h1{margin-top:0}.sub{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:block;font-weight:bold;margin:9px 0}
input,select{width:100%;padding:10px;border:1px solid #ccd2da;border-radius:8px;box-sizing:border-box}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}
.primary{background:#1f6feb;color:#fff}.secondary{background:#e9eef6}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca;padding:13px;border-radius:8px;white-space:pre-wrap}
.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#f8fafc;border:1px solid #e4e7ec;padding:14px;border-radius:9px}.stat b{display:block;font-size:24px;margin-top:5px}
.table{overflow:auto;max-height:520px;border:1px solid #e4e7ec}
table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}
.note{background:#eff8ff;border:1px solid #b2ddff;color:#175cd3;padding:12px;border-radius:8px;margin-top:14px}
@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📊 Excel PL vs BARANG Checker</h1>
<p class="sub">Membandingkan baris PL dengan baris BARANG pada posisi yang sama. File diproses langsung di browser.</p>
<div class="grid">
<div><label>File PL</label><input id="pl" type="file" accept=".xlsx,.xls"><div id="pls" class="hidden"><label>Sheet PL</label><select id="plslt"></select></div></div>
<div><label>File BARANG</label><input id="br" type="file" accept=".xlsx,.xls"><div id="brs" class="hidden"><label>Sheet BARANG</label><select id="brslt"></select></div></div>
</div>
<div class="actions"><button class="primary" id="go">🔍 Bandingkan</button></div>
<div id="msg"></div>
</div>

<div id="result" class="card hidden">
<div class="stats">
<div class="stat">Baris PL<b id="pc">0</b></div>
<div class="stat">Baris BARANG<b id="bc">0</b></div>
<div class="stat">Perbedaan<b id="dc">0</b></div>
</div>
<div id="content" style="margin-top:18px"></div>
<button class="primary hidden" id="download">⬇️ Download Hasil Perbandingan</button>
</div>
</div>

<script>
let P=null,B=null,diffs=[];
const $=id=>document.getElementById(id);

function txt(v){
  if(v==null) return "";
  return String(v).replace(/\r|\n/g," ").replace(/\s+/g," ").trim().toUpperCase();
}

function num(v){
  if(v==null || String(v).trim()==="") return null;
  if(typeof v==="number" && Number.isFinite(v)) return v;
  let s=String(v).trim().replace(/\s/g,"");
  if(/^[-]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else if(/^[-]?\d+(,\d+)$/.test(s)) s=s.replace(",",".");
  let n=Number(s);
  return Number.isFinite(n)?n:null;
}

function eq(a,b){
  let x=num(a),y=num(b);
  if(x!==null && y!==null) return Math.abs(x-y)<=1e-6;
  return txt(a)===txt(b);
}

function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function read(f){ return XLSX.read(await f.arrayBuffer(),{type:"array"}); }

function sheets(w,sid,wid){
  $(sid).innerHTML="";
  w.SheetNames.forEach(n=>{
    let o=document.createElement("option");
    o.value=n;o.textContent=n;$(sid).appendChild(o);
  });
  $(wid).classList.remove("hidden");
}

function rows(w,s){
  return XLSX.utils.sheet_to_json(w.Sheets[s],{header:1,defval:null,raw:true});
}

/*
  Cari baris header berdasarkan kata-kata penting.
  File PL baru punya header bertingkat:
  baris pertama: STYLE / ITEM NAME / TOTAL QTY / WEIGHT
  baris berikutnya: GW / NW
  Jadi kita baca 2 baris header bila memang diperlukan.
*/
function detectHeader(rows, type){
  const first=type==="pl"
    ? ["STYLE","MATERIAL CODE","ITEM NAME","TOTAL QTY (PAIRS)","QTY"]
    : ["KODE BARANG","URAIAN","JUMLAH SATUAN"];

  for(let i=0;i<Math.min(rows.length,35);i++){
    const line=(rows[i]||[]).map(txt);
    const hits=first.filter(c=>line.includes(txt(c))).length;

    if(hits>=2 || (type==="pl" && (line.includes("STYLE")||line.includes("MATERIAL CODE")) && line.includes("ITEM NAME"))){
      let headerRows=1;

      // PL tertentu memiliki baris subheader GW/NW tepat di bawah header utama.
      if(type==="pl" && i+1<rows.length){
        const next=(rows[i+1]||[]).map(txt);
        const subHits=["GW","G/W","NW","N/W","NETTO","BRUTO"].filter(c=>next.includes(txt(c))).length;
        if(subHits>0) headerRows=2;
      }

      return {row:i,headerRows};
    }
  }
  return null;
}

function buildColumns(rows, headerInfo){
  const start=headerInfo.row;
  const count=headerInfo.headerRows;
  const maxCols=Math.max(...rows.slice(start,start+count).map(r=>(r||[]).length),0);
  const cols=[];

  for(let j=0;j<maxCols;j++){
    const parts=[];
    for(let r=start;r<start+count;r++){
      const v=txt(rows[r]?.[j]);
      if(v && !parts.includes(v)) parts.push(v);
    }
    cols.push({index:j,label:parts.join(" ")});
  }
  return cols;
}

function findCol(cols,cands){
  const normalized=cands.map(txt);

  // Exact match first.
  for(const c of cols){
    if(normalized.includes(c.label)) return c;
  }

  // Then allow composite headers, e.g. "WEIGHT GW" / "WEIGHT NW".
  for(const c of cols){
    const label=c.label;
    for(const cand of normalized){
      if(cand && label.split(" ").includes(cand)) return c;
    }
  }

  // Finally substring match for common variants.
  for(const c of cols){
    const label=c.label;
    for(const cand of normalized){
      if(cand && (label.includes(cand) || cand.includes(label))) return c;
    }
  }
  return null;
}

function buildData(rows, headerInfo, cols){
  const data=[];
  const start=headerInfo.row+headerInfo.headerRows;

  for(let i=start;i<rows.length;i++){
    const row=rows[i]||[];
    const values=cols.map(c=>row[c.index]??null);

    // Skip completely empty rows.
    if(values.every(v=>v==null || String(v).trim()==="")) continue;

    data.push({values,excelRow:i+1});
  }
  return data;
}

$("pl").onchange=async e=>{
  try{
    P=await read(e.target.files[0]);
    sheets(P,"plslt","pls");
    $("msg").innerHTML="";
    $("result").classList.add("hidden");
  }catch(x){
    $("msg").innerHTML='<div class="error">File PL tidak bisa dibaca.</div>';
  }
};

$("br").onchange=async e=>{
  try{
    B=await read(e.target.files[0]);
    sheets(B,"brslt","brs");
    $("msg").innerHTML="";
    $("result").classList.add("hidden");
  }catch(x){
    $("msg").innerHTML='<div class="error">File BARANG tidak bisa dibaca.</div>';
  }
};

$("go").onclick=()=>{
  $("msg").innerHTML="";
  $("result").classList.add("hidden");
  $("download").classList.add("hidden");

  if(!P||!B){
    $("msg").innerHTML='<div class="error">Pilih file PL dan BARANG terlebih dahulu.</div>';
    return;
  }

  try{
    const pr=rows(P,$("plslt").value);
    const br=rows(B,$("brslt").value);

    const ph=detectHeader(pr,"pl");
    const bh=detectHeader(br,"barang");

    if(!ph) throw Error("Header PL tidak ditemukan. Pastikan ada STYLE/MATERIAL CODE dan ITEM NAME.");
    if(!bh) throw Error("Header BARANG tidak ditemukan. Pastikan ada KODE BARANG, URAIAN, dan JUMLAH SATUAN.");

    const pc=buildColumns(pr,ph);
    const bc=buildColumns(br,bh);

    // PL: STYLE dipakai sebagai pengganti MATERIAL CODE bila MATERIAL CODE tidak ada.
    const pCode=findCol(pc,["MATERIAL CODE","STYLE","MATERIALCODE"]);
    const pItem=findCol(pc,["ITEM NAME","ITEMNAME"]);
    const pQty=findCol(pc,["QTY","TOTAL QTY","TOTAL QTY (PAIRS)","QUANTITY"]);
    const pNet=findCol(pc,["N/W","NW","NETTO","NET WEIGHT"]);
    const pGross=findCol(pc,["G/W","GW","BRUTO","GROSS WEIGHT"]);

    const bCode=findCol(bc,["KODE BARANG","KODEBARANG"]);
    const bItem=findCol(bc,["URAIAN"]);
    const bQty=findCol(bc,["JUMLAH SATUAN","JUMLAHSATUAN","QTY","QUANTITY"]);
    const bNet=findCol(bc,["NETTO","NET WEIGHT"]);
    const bGross=findCol(bc,["BRUTO","GROSS WEIGHT"]);

    const req={
      "PL - MATERIAL CODE / STYLE":pCode,
      "PL - ITEM NAME":pItem,
      "PL - QTY / TOTAL QTY":pQty,
      "PL - NETTO / NW":pNet,
      "PL - BRUTO / GW":pGross,
      "BARANG - KODE BARANG":bCode,
      "BARANG - URAIAN":bItem,
      "BARANG - JUMLAH SATUAN":bQty,
      "BARANG - NETTO":bNet,
      "BARANG - BRUTO":bGross
    };

    const miss=Object.entries(req).filter(x=>!x[1]).map(x=>x[0]);
    if(miss.length) throw Error("Kolom tidak ditemukan:\n"+miss.join("\n"));

    const p=buildData(pr,ph,pc);
    const b=buildData(br,bh,bc);

    diffs=[];
    const n=Math.max(p.length,b.length);

    for(let i=0;i<n;i++){
      const x=p[i]?.values||[];
      const y=b[i]?.values||[];

      const checks=[
        ["MATERIAL CODE / STYLE ↔ KODE BARANG",pCode,bCode],
        ["ITEM NAME ↔ URAIAN",pItem,bItem],
        ["QTY / TOTAL QTY ↔ JUMLAH SATUAN",pQty,bQty],
        ["NETTO / NW ↔ NETTO",pNet,bNet],
        ["BRUTO / GW ↔ BRUTO",pGross,bGross]
      ];

      checks.forEach(([field,pcCol,bcCol])=>{
        const pv=pcCol ? x[pcCol.index] : null;
        const bv=bcCol ? y[bcCol.index] : null;

        if(!eq(pv,bv)){
          diffs.push({
            "BARIS DATA":i+1,
            "FIELD":field,
            "PL":pv??"",
            "BARANG":bv??""
          });
        }
      });
    }

    $("pc").textContent=p.length;
    $("bc").textContent=b.length;
    $("dc").textContent=diffs.length;
    $("result").classList.remove("hidden");

    if(!diffs.length){
      // Sesuai permintaan: bila semua cocok, tidak menampilkan notifikasi sukses.
      $("content").innerHTML="";
      return;
    }

    let h="<h2>Perbedaan Ditemukan</h2><div class='table'><table><thead><tr><th>Baris Data</th><th>Field</th><th>PL</th><th>BARANG</th></tr></thead><tbody>";

    diffs.forEach(d=>{
      h+=`<tr><td>${esc(d["BARIS DATA"])}</td><td>${esc(d.FIELD)}</td><td>${esc(d.PL)}</td><td>${esc(d.BARANG)}</td></tr>`;
    });

    $("content").innerHTML=h+"</tbody></table></div>";
    $("download").classList.remove("hidden");

  }catch(x){
    $("msg").innerHTML='<div class="error">'+esc(x.message)+'</div>';
  }
};

$("download").onclick=()=>{
  const ws=XLSX.utils.json_to_sheet(diffs);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"PERBEDAAN");
  XLSX.writeFile(wb,"hasil_perbandingan_PL_vs_BARANG.xlsx");
};
</script>
</body>
</html>
